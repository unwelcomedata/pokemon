project_name: "pokemon"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # PokéAPI — keyless public REST API (https://pokeapi.co/).
  # Pulled via src/ingest.ingest_pokeapi() (paginated per-species JSON), not the
  # generic ingest_source() html/csv path. All 9 generations (~1025 species).
  pokeapi:
    base_url: https://pokeapi.co/api/v2
    type: json_api
    # endpoints walked by the ingest function:
    #   /pokemon?limit=100000   → full species list (name + detail URL)
    #   /pokemon/{id}           → base stats (6), types, species URL, is_default
    #   /pokemon-species/{id}   → generation, is_legendary, is_mythical
    rate_limit_seconds: 1.5     # polite delay; PokéAPI asks for caching + light use
    license: "PokéAPI data is freely available; Pokémon names/stats © Nintendo/Game Freak/The Pokémon Company (nominative/fair use, non-commercial)"

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
