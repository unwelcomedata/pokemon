<?xml version="1.0" encoding="UTF-8"?>
<!--
  @unwelcomedata — PROJECT INFOGRAPHIC (landscape social render 1600x900)
  Project: pokemon. Two-column layout off the shared brand frame.
  Same computed data marks as the tall render (chart_legendary_vs_field,
  chart_type_avg, chart_generation_avg). Base forms only.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">

  <rect width="1600" height="900" fill="#FBF8F0"/>

  <!-- HEADER BAND -->
  <rect x="0" y="0" width="1600" height="188" fill="#003049"/>
  <text x="80" y="82" fill="#FFFFFF" font-size="52" font-weight="bold">Pok&#233;mon Stat Fingerprints</text>
  <text x="80" y="128" fill="#94D2BD" font-size="30" font-weight="bold">What 1,025 Pok&#233;mon look like, measured six ways</text>
  <text x="80" y="162" fill="#E9D8A6" font-size="19">Base stats (HP / Attack / Defense / Sp. Atk / Sp. Def / Speed) &#183; base forms only.</text>

  <!-- vertical column divider -->
  <line x1="800" y1="230" x2="800" y2="800" stroke="#E9D8A6" stroke-width="3"/>

  <!-- ===== LEFT COLUMN: radar (legendaries vs field) ===== -->
  <text x="80" y="250" fill="#003049" font-size="27" font-weight="bold">Legendaries are a tier apart</text>
  <text x="80" y="277" fill="#6B7280" font-size="18">Avg base stats &#8212; 94 legendary/mythical (BST 592) vs 931 field (BST 411).</text>

  <!-- radar center 400,540 R190 -->
  <polygon points="400.0,476.7 454.8,508.3 454.8,571.7 400.0,603.3 345.2,571.7 345.2,508.3" fill="none" stroke="#E5E0D2" stroke-width="2"/>
  <polygon points="400.0,413.3 509.7,476.7 509.7,603.3 400.0,666.7 290.3,603.3 290.3,476.7" fill="none" stroke="#E5E0D2" stroke-width="2"/>
  <polygon points="400.0,350.0 564.5,445.0 564.5,635.0 400.0,730.0 235.5,635.0 235.5,445.0" fill="none" stroke="#D8D2C0" stroke-width="2"/>
  <line x1="400" y1="540" x2="400.0" y2="350.0" stroke="#D8D2C0" stroke-width="1.5"/>
  <line x1="400" y1="540" x2="564.5" y2="445.0" stroke="#D8D2C0" stroke-width="1.5"/>
  <line x1="400" y1="540" x2="564.5" y2="635.0" stroke="#D8D2C0" stroke-width="1.5"/>
  <line x1="400" y1="540" x2="400.0" y2="730.0" stroke="#D8D2C0" stroke-width="1.5"/>
  <line x1="400" y1="540" x2="235.5" y2="635.0" stroke="#D8D2C0" stroke-width="1.5"/>
  <line x1="400" y1="540" x2="235.5" y2="445.0" stroke="#D8D2C0" stroke-width="1.5"/>

  <polygon points="400.0,432.6 502.7,480.7 496.0,595.4 400.0,645.6 307.7,593.3 311.7,489.0" fill="#0A9396" fill-opacity="0.22" stroke="#0A9396" stroke-width="3.5"/>
  <polygon points="400.0,392.0 541.5,458.3 534.0,617.3 400.0,703.7 263.8,618.6 270.0,464.9" fill="#BB3E03" fill-opacity="0.22" stroke="#BB3E03" stroke-width="3.5"/>

  <text x="400.0" y="324.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="middle">HP</text>
  <text x="587.1" y="432.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="start">Attack</text>
  <text x="587.1" y="654.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="start">Defense</text>
  <text x="400.0" y="760.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="middle">Sp. Atk</text>
  <text x="212.9" y="654.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="end">Sp. Def</text>
  <text x="212.9" y="432.0" fill="#003049" font-size="17" font-weight="bold" text-anchor="end">Speed</text>

  <!-- legend -->
  <rect x="628" y="520" width="22" height="15" fill="#BB3E03" fill-opacity="0.5" stroke="#BB3E03" stroke-width="2.5"/>
  <text x="658" y="533" fill="#003049" font-size="17" font-weight="bold">Legendary (94)</text>
  <rect x="628" y="548" width="22" height="15" fill="#0A9396" fill-opacity="0.5" stroke="#0A9396" stroke-width="2.5"/>
  <text x="658" y="561" fill="#003049" font-size="17" font-weight="bold">Field (931)</text>

  <!-- ===== RIGHT COLUMN ===== -->
  <!-- top: Steel is the wall -->
  <text x="860" y="250" fill="#003049" font-size="27" font-weight="bold">Steel is the wall</text>
  <text x="860" y="277" fill="#6B7280" font-size="18">Average Defense by primary type &#8212; Steel stands well above the rest.</text>
  <!-- bars track x1010..1540 = 530px, max 111.1 -->
  <text x="990" y="320" fill="#003049" font-size="18" font-weight="bold" text-anchor="end">Steel</text>
  <rect x="1010" y="302" width="530.0" height="24" fill="#6B7280"/>
  <text x="1532" y="320" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="end">111</text>
  <text x="990" y="356" fill="#003049" font-size="18" font-weight="bold" text-anchor="end">Rock</text>
  <rect x="1010" y="338" width="468.0" height="24" fill="#94D2BD"/>
  <text x="1486" y="356" fill="#003049" font-size="16" font-weight="bold">98</text>
  <text x="990" y="392" fill="#003049" font-size="18" font-weight="bold" text-anchor="end">Ground</text>
  <rect x="1010" y="374" width="409.8" height="24" fill="#94D2BD"/>
  <text x="1427" y="392" fill="#003049" font-size="16" font-weight="bold">86</text>
  <text x="990" y="428" fill="#003049" font-size="18" font-weight="bold" text-anchor="end">Ghost</text>
  <rect x="1010" y="410" width="360.2" height="24" fill="#94D2BD"/>
  <text x="1378" y="428" fill="#003049" font-size="16" font-weight="bold">76</text>
  <text x="990" y="464" fill="#003049" font-size="18" font-weight="bold" text-anchor="end">Dragon</text>
  <rect x="1010" y="446" width="358.7" height="24" fill="#94D2BD"/>
  <text x="1376" y="464" fill="#003049" font-size="16" font-weight="bold">75</text>

  <!-- gold hairline between right-column findings -->
  <line x1="860" y1="508" x2="1540" y2="508" stroke="#E9D8A6" stroke-width="3"/>

  <!-- bottom: power creep -->
  <text x="860" y="552" fill="#003049" font-size="27" font-weight="bold">A slow power creep</text>
  <text x="860" y="579" fill="#6B7280" font-size="18">Average base-stat total by generation &#8212; a gentle rise, Gen 1 (408) to Gen 9 (457).</text>
  <!-- plot x 1120..1540, y 620..720 (bst 400..460); gridlines 400/430/460 -->
  <line x1="1120" y1="620.0" x2="1540" y2="620.0" stroke="#E5E0D2" stroke-width="2"/>
  <text x="1112" y="626" fill="#9AA0A6" font-size="14" text-anchor="end">460</text>
  <line x1="1120" y1="670.0" x2="1540" y2="670.0" stroke="#E5E0D2" stroke-width="2"/>
  <text x="1112" y="676" fill="#9AA0A6" font-size="14" text-anchor="end">430</text>
  <line x1="1120" y1="720.0" x2="1540" y2="720.0" stroke="#D8D2C0" stroke-width="2"/>
  <text x="1112" y="726" fill="#9AA0A6" font-size="14" text-anchor="end">400</text>
  <polyline fill="none" stroke="#0A9396" stroke-width="4" stroke-linejoin="round" points="1120.0,707.3 1172.5,708.0 1225.0,713.8 1277.5,644.0 1330.0,677.0 1382.5,671.2 1435.0,637.7 1487.5,654.7 1540.0,624.3"/>
  <text x="1120" y="744" fill="#6B7280" font-size="14" text-anchor="middle">Gen 1</text>
  <text x="1540" y="744" fill="#6B7280" font-size="14" text-anchor="middle">Gen 9</text>

  <!-- FOOTER BAND -->
  <rect x="0" y="812" width="1600" height="88" fill="#003049"/>
  <text x="80" y="855" fill="#FFFFFF" font-size="22" font-weight="bold">@unwelcomedata</text>
  <text x="80" y="883" fill="#94D2BD" font-size="17">Pok&#233;API (pokeapi.co) &#183; 1,025 species, all 9 generations; averages are base forms only (megas &amp; alt forms excluded).</text>
</svg>
